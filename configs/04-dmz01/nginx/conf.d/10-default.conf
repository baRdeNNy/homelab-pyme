# HTTP -> HTTPS para cualquier nombre
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS con un nombre desconocido o por IP: se cierra la conexión sin responder
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    return 444;
}
